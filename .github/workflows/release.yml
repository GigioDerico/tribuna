name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Manifest & Run Unit Tests
        run: ./gradlew testDebugUnitTest :app:verifyMergedManifest

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/Tribuna-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
