<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-app);color:var(--fg-1);font-family:var(--font-body);padding:20px;box-sizing:border-box}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:12px;border:1px solid var(--border-1)}.n{font:var(--type-label);font-weight:700}.v{font:var(--type-caption);color:var(--fg-2);font-family:var(--font-mono)}.lbl{font:var(--type-label);color:var(--fg-2);text-transform:uppercase;letter-spacing:.04em}</style></head><body><div class="g"><div data-theme="dark" style="background:var(--bg-app);padding:14px;border-radius:14px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px"><div class="sw"><div class="chip" style="background:var(--bg-app)"></div><div class="n" style="color:var(--fg-1)">bg-app</div></div><div class="sw"><div class="chip" style="background:var(--bg-prompt)"></div><div class="n" style="color:var(--fg-1)">bg-prompt</div></div><div class="sw"><div class="chip" style="background:var(--surface-1)"></div><div class="n" style="color:var(--fg-1)">surface-1</div></div><div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="n" style="color:var(--fg-1)">surface-2</div></div><div class="sw"><div class="chip" style="background:var(--surface-sheet)"></div><div class="n" style="color:var(--fg-1)">surface-sheet</div></div><div class="sw"><div class="chip" style="background:var(--surface-dialog)"></div><div class="n" style="color:var(--fg-1)">surface-dialog</div></div></div><div data-theme="light" style="background:var(--bg-app);padding:14px;border-radius:14px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px"><div class="sw"><div class="chip" style="background:var(--bg-app)"></div><div class="n" style="color:var(--fg-1)">bg-app</div></div><div class="sw"><div class="chip" style="background:var(--bg-prompt)"></div><div class="n" style="color:var(--fg-1)">bg-prompt</div></div><div class="sw"><div class="chip" style="background:var(--surface-1)"></div><div class="n" style="color:var(--fg-1)">surface-1</div></div><div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="n" style="color:var(--fg-1)">surface-2</div></div><div class="sw"><div class="chip" style="background:var(--surface-sheet)"></div><div class="n" style="color:var(--fg-1)">surface-sheet</div></div><div class="sw"><div class="chip" style="background:var(--surface-dialog)"></div><div class="n" style="color:var(--fg-1)">surface-dialog</div></div></div></div></body></html>
