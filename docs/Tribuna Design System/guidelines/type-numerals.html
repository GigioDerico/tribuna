<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-app);color:var(--fg-1);font-family:var(--font-body);padding:20px;box-sizing:border-box}.g{display:grid;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border-radius:12px;border:1px solid var(--border-1)}.n{font:var(--type-label);font-weight:700}.v{font:var(--type-caption);color:var(--fg-2);font-family:var(--font-mono)}.lbl{font:var(--type-label);color:var(--fg-2);text-transform:uppercase;letter-spacing:.04em}</style></head><body><div style="display:flex;gap:40px;align-items:center"><div style="font:var(--type-countdown);font-weight:700;color:var(--accent-text)">3</div><div style="display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums"><div style="font:var(--type-stat);font-weight:700">28:12</div><div style="font:var(--type-timer);font-weight:700">12:04 <span style="color:var(--fg-2);font-weight:500">restam 17:56</span></div><div style="font:var(--type-timer);font-weight:700;color:var(--danger)">restam 00:58</div></div></div></body></html>
