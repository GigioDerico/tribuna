<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:#07151A}body{font-family:var(--font-body)}.pair{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.pane{padding:20px;background:var(--bg-app);color:var(--fg-1);display:flex;flex-direction:column;gap:14px;position:relative}.lbl{font:var(--type-label);color:var(--fg-2);text-transform:uppercase;letter-spacing:.04em}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const NS=window.TribunaDesignSystem_cb0bc4;
const {SegmentedControl,Chip,Slider,Switch,Stepper,ThemeSwatch,ColorButton,PROMPT_PRESETS}=NS;
function Demo(){const [m,setM]=React.useState('voz');const [on,setOn]=React.useState(true);const [v,setV]=React.useState(44);
return <><SegmentedControl label="Modo" value={m} onChange={setM} options={[{value:'voz',label:'Voz',icon:'mic'},{value:'constante',label:'Constante'}]}/>
<div className="row"><Chip selected>Sans</Chip><Chip>Serif</Chip><Chip>Mono</Chip></div>
<Slider label="Tamanho da fonte" min={24} max={96} value={v} onChange={setV} display={v+' sp'}/>
<div className="row" style={{justifyContent:'space-between'}}><Switch checked={on} onChange={setOn} label="Ligado"/><Switch label="Desligado"/><Stepper value="30 min"/></div>
<div style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:8}}>{PROMPT_PRESETS.map((p,i)=><ThemeSwatch key={p.id} {...p} selected={i===0}/>)}</div>
<div style={{display:'grid',gridTemplateColumns:'repeat(3,minmax(0,1fr))',gap:8}}><ColorButton color="#FFFFFF" label="Texto"/><ColorButton color="#05141A" label="Fundo"/><ColorButton color="#5CF2C0" label="Destaque"/></div></>;}
function Pair(){return <div className="pair"><div className="pane" data-theme="dark"><Demo theme="dark"/></div><div className="pane" data-theme="light"><Demo theme="light"/></div></div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Pair/>);
</script></body></html>
